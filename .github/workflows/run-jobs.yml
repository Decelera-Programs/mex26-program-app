name: Run Scheduled Backend Jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Call backend jobs endpoint
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          JOBS_API_KEY: ${{ secrets.JOBS_API_KEY }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "Missing BACKEND_BASE_URL secret"
            exit 1
          fi
          if [ -z "$JOBS_API_KEY" ]; then
            echo "Missing JOBS_API_KEY secret"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -X POST "${BACKEND_BASE_URL%/}/jobs/run-all" \
            -H "x-job-key: $JOBS_API_KEY" \
            -H "Content-Type: application/json"
